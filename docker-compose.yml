version: "3.8"

services:
  # Main Backend Service (API Gateway)
  backend:
    build: ./backend
    container_name: sih2026-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ML_SERVICE_URL=http://ml_service:8001
    depends_on:
      - ml_service
    restart: unless-stopped
    networks:
      - sih2026-network

  # ML Risk Scoring Microservice
  ml_service:
    build: ./ml_service
    container_name: sih2026-ml-service
    ports:
      - "8001:8001"
    env_file:
      - ./ml_service/.env
    restart: unless-stopped
    networks:
      - sih2026-network

networks:
  sih2026-network:
    driver: bridge
